[project]
name = "bicomments"
version = "0.1.0"
description = "Layered crawler for Bilibili video metadata and comment ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
]

[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"
